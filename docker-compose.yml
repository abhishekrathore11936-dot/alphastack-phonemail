services:
  backend:
    build: ./phonemail-backend   # <-- Updated to match your folder name
    container_name: phonemail-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: always

  frontend:
    build: ./mobile-client
    container_name: phonemail-frontend
    ports:
      - "5174:5174"
    environment:
      - VITE_SOCKET_URL=http://localhost:5001
    depends_on:
      - backend
    restart: always